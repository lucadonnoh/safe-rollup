# Blockscout for Safe Rollup: Postgres, backend and frontend behind nginx on 127.0.0.1:8091.
# Pinned to the last releases under GPL-3.0 with public images (backend 9.0.2, frontend v2.3.1):
# Blockscout moved to a proprietary licence and private images on 2026-04-22.
#   docker compose -f compose.yml --env-file ~/safe-rollup/explorer.env up -d
# explorer.env sets POSTGRES_PASSWORD, SECRET_KEY_BASE and the public URLs (EXPLORER_PROTOCOL,
# EXPLORER_HOST, EXPLORER_WS_PROTOCOL, RPC_URL, STATUS_URL). The explorer needs a hostname of its own:
# Blockscout's frontend cannot be served under a sub-path.
name: safe-rollup-explorer

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "3"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    shm_size: 256m
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/blockscout/blockscout-optimism:9.0.2
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 1m
    depends_on:
      db:
        condition: service_healthy
    command: sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file: backend.env
    environment:
      DATABASE_URL: postgresql://blockscout:${POSTGRES_PASSWORD}@db:5432/blockscout
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      BLOCKSCOUT_HOST: ${EXPLORER_HOST}
      BLOCKSCOUT_PROTOCOL: ${EXPLORER_PROTOCOL}

  frontend:
    image: ghcr.io/blockscout/frontend:v2.3.1
    restart: unless-stopped
    logging: *logging
    env_file: frontend.env
    environment:
      NEXT_PUBLIC_APP_PROTOCOL: ${EXPLORER_PROTOCOL}
      NEXT_PUBLIC_APP_HOST: ${EXPLORER_HOST}
      NEXT_PUBLIC_API_PROTOCOL: ${EXPLORER_PROTOCOL}
      NEXT_PUBLIC_API_HOST: ${EXPLORER_HOST}
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ${EXPLORER_WS_PROTOCOL}
      NEXT_PUBLIC_NETWORK_RPC_URL: ${RPC_URL}
      NEXT_PUBLIC_FOOTER_LINKS: "[{'title':'Safe Rollup','links':[{'text':'About and disclaimer','url':'${STATUS_URL}'},{'text':'Safe trademark policy','url':'https://safe.global/trademark'}]}]"

  proxy:
    image: nginx:1.30
    restart: unless-stopped
    logging: *logging
    depends_on: [backend, frontend]
    ports:
      - 127.0.0.1:8091:80
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro

  # op-geth listens on 127.0.0.1 only. This puts the sequencer's and the verifier's HTTP RPC on the
  # Docker bridge address, where the backend reaches them as host.docker.internal, without opening
  # them to the LAN.
  rpc-relay:
    # Only while the chain runs: docker compose --profile live up -d
    profiles: [live]
    image: nginx:1.30
    restart: unless-stopped
    logging: *logging
    network_mode: host
    volumes:
      - ./rpc-relay.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db:
