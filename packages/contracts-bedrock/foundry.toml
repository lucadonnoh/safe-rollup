[profile.default]
src = 'src'
out = 'forge-artifacts'
script = 'scripts'

optimizer = true
optimizer_runs = 999999
bytecode_hash = 'none'
evm_version = 'cancun'

remappings = [
  '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts',
  '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts',
  '@openzeppelin/contracts-v5/=lib/openzeppelin-contracts-v5/contracts',
  '@rari-capital/solmate/=lib/solmate',
  '@solady/=lib/solady/src',
  'forge-std/=lib/forge-std/src',
  'safe-contracts/=lib/safe-contracts/contracts',
  'interfaces/=interfaces'
]

fs_permissions = [
  { access='read', path = './forge-artifacts/' },
  { access='read-write', path='./.testdata/' },
]

# 5159 = selfdestruct deprecation
# 8429 = virtual modifiers deprecated (solc 0.8.31, triggered by solmate)
# 2424 = natspec memory-safe-assembly comment deprecated (solc 0.8.31, triggered by forge-std)
ignored_error_codes = ["code-size", "init-code-size", "too-many-warnings", 5159, 8429, 2424]
# solady and safe-contracts trigger newer solc deprecation warnings (6335, 9207).
ignored_warnings_from = ["lib/solady", "lib/safe-contracts"]
deny = "warnings"

# test_callWithMinGas_noLeakageHigh_succeeds needs more than the default 1B gas.
gas_limit = 9223372036854775807

[fuzz]
runs = 64

[lint]
lint_on_build = false

[fmt]
line_length=120
multiline_func_header='all'
bracket_spacing=true
wrap_comments=true

# Unoptimized build for faster compiles.
[profile.lite]
optimizer = false
